# .github/workflows/snake.yml
name: Generate Snake
on:
  schedule:
    - cron: "0 0 * * *" # Executa diariamente à meia-noite UTC.
  workflow_dispatch: # Permite acionar a ação manualmente no GitHub.
jobs:
  build:
    runs-on: ubuntu-latest # Manter ubuntu-latest para se beneficiar das atualizações
    steps:
      - uses: actions/checkout@v4 # Atualizado para v4
      - uses: Platane/snk@v3 # Atualizado para v3
        id: snake-gif
        with:
          github_user_name: PatrickDias2 # Certifique-se de que este é o seu nome de usuário do GitHub!
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake.gif
            dist/github-contribution-grid-snake-dark.svg
            dist/github-contribution-grid-snake-dark.gif
      - uses: crazy-max/ghaction-github-pages@v3 # Atualizado para v3 para compatibilidade
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
